
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WEEBros.hu</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #070710;
      --text: #f7f5ff;
      --muted: #9695b2;
      --purple: #a78bfa;
      --cyan: #6ee7f9;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: "DM Sans", sans-serif;
      display: grid;
      place-items: center;
      position: relative;
      isolation: isolate;
    }

    /* Animated background */
    .background {
      position: fixed;
      inset: 0;
      z-index: -3;
      overflow: hidden;
      background:
        radial-gradient(ellipse at 20% 20%, #25204a 0%, transparent 45%),
        radial-gradient(ellipse at 80% 80%, #102b3c 0%, transparent 45%),
        #070710;
    }

    .aurora {
      position: absolute;
      width: 60vw;
      height: 60vw;
      min-width: 400px;
      min-height: 400px;
      border-radius: 50%;
      filter: blur(100px);
      opacity: 0.2;
      animation: aurora 16s ease-in-out infinite alternate;
    }

    .aurora.one {
      background: #7746ff;
      top: -30%;
      left: -15%;
    }

    .aurora.two {
      background: #007eae;
      right: -25%;
      bottom: -35%;
      animation-delay: -7s;
    }

    .aurora.three {
      background: #d946ef;
      width: 30vw;
      height: 30vw;
      top: 35%;
      left: 40%;
      animation-duration: 20s;
      opacity: 0.09;
    }

    @keyframes aurora {
      0% {
        transform: translate(0, 0) scale(1) rotate(0deg);
      }
      50% {
        transform: translate(10%, 12%) scale(1.15) rotate(90deg);
      }
      100% {
        transform: translate(-8%, -6%) scale(0.9) rotate(180deg);
      }
    }

    /* Fine cinematic grid */
    .grid {
      position: fixed;
      inset: 0;
      z-index: -2;
      background-image:
        linear-gradient(#ffffff08 1px, transparent 1px),
        linear-gradient(90deg, #ffffff08 1px, transparent 1px);
      background-size: 65px 65px;
      mask-image: linear-gradient(to bottom, black, transparent 90%);
      pointer-events: none;
    }

    .noise {
      position: fixed;
      inset: 0;
      z-index: 5;
      pointer-events: none;
      opacity: 0.035;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.8'/%3E%3C/svg%3E");
    }

    #particles {
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
    }

    /* Main layout */
    main {
      width: min(100% - 40px, 900px);
      padding: 50px 0;
      text-align: center;
      position: relative;
      z-index: 2;
      animation: entrance 1.2s cubic-bezier(.2,.8,.2,1) both;
    }

    @keyframes entrance {
      from {
        opacity: 0;
        transform: translateY(35px);
        filter: blur(12px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
        filter: blur(0);
      }
    }

    .top-label {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 9px 15px;
      border: 1px solid #ffffff17;
      border-radius: 50px;
      background: #ffffff06;
      color: #c9c7df;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 3px;
      text-transform: uppercase;
      backdrop-filter: blur(12px);
      margin-bottom: 32px;
      animation: fadeUp 1s 0.2s both;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #75f4bd;
      box-shadow: 0 0 12px #75f4bd;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: .45; transform: scale(.75); }
    }

    h1 {
      font-family: "Space Grotesk", sans-serif;
      font-size: clamp(64px, 12vw, 126px);
      font-weight: 600;
      letter-spacing: -0.095em;
      line-height: 0.95;
      margin-bottom: 26px;
      animation: fadeUp 1s 0.3s both;
    }

    h1 span {
      background: linear-gradient(
        110deg,
        #ffffff 5%,
        #c4b5fd 35%,
        #83e9fa 65%,
        #ffffff 95%
      );
      background-size: 200% auto;
      color: transparent;
      background-clip: text;
      -webkit-background-clip: text;
      animation: shimmer 7s linear infinite;
    }

    @keyframes shimmer {
      to { background-position: 200% center; }
    }

    .description {
      max-width: 420px;
      margin: 0 auto;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.9;
      animation: fadeUp 1s 0.45s both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(18px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Exactly two primary links */
    .links {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
      max-width: 650px;
      margin: 55px auto 0;
      perspective: 1000px;
    }

    .link-card {
      --glow: 167, 139, 250;
      position: relative;
      isolation: isolate;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      min-height: 215px;
      padding: 27px;
      overflow: hidden;
      text-decoration: none;
      color: var(--text);
      text-align: left;
      border: 1px solid #ffffff16;
      border-radius: 22px;
      background: linear-gradient(145deg, #ffffff0c, #ffffff03);
      backdrop-filter: blur(20px);
      box-shadow: 0 12px 50px #00000015;
      transform-style: preserve-3d;
      transition:
        border-color .4s,
        background .4s,
        box-shadow .4s,
        transform .2s;
      animation: fadeUp .8s both;
    }

    .link-card:nth-child(1) {
      animation-delay: .55s;
    }

    .link-card:nth-child(2) {
      --glow: 110, 231, 249;
      animation-delay: .7s;
    }

    .link-card::before {
      content: "";
      position: absolute;
      z-index: -1;
      width: 220px;
      height: 220px;
      right: -100px;
      bottom: -130px;
      border-radius: 50%;
      background: rgba(var(--glow), .22);
      filter: blur(45px);
      transition: transform .6s, opacity .6s;
      opacity: .5;
    }

    .link-card::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      padding: 1px;
      background: linear-gradient(
        135deg,
        rgba(var(--glow), .5),
        transparent 40%,
        transparent 70%,
        rgba(var(--glow), .18)
      );
      mask: linear-gradient(#000 0 0) content-box,
            linear-gradient(#000 0 0);
      mask-composite: exclude;
      pointer-events: none;
      opacity: 0;
      transition: opacity .4s;
    }

    .link-card:hover {
      border-color: rgba(var(--glow), .4);
      background: linear-gradient(145deg, #ffffff12, #ffffff04);
      box-shadow: 0 20px 80px rgba(var(--glow), .12);
      transform: translateY(-8px);
    }

    .link-card:hover::before {
      transform: scale(1.8);
      opacity: 1;
    }

    .link-card:hover::after {
      opacity: 1;
    }

    .card-top {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: auto;
    }

    .icon-box {
      width: 48px;
      height: 48px;
      display: grid;
      place-items: center;
      border-radius: 14px;
      border: 1px solid rgba(var(--glow), .25);
      background: rgba(var(--glow), .09);
      color: rgb(var(--glow));
      transition: transform .4s, background .4s;
    }

    .link-card:hover .icon-box {
      transform: rotate(-8deg) scale(1.1);
      background: rgba(var(--glow), .17);
    }

    .icon-box svg {
      width: 23px;
      height: 23px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.6;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .arrow {
      color: #85839e;
      font-size: 23px;
      transition: transform .35s, color .35s;
    }

    .link-card:hover .arrow {
      transform: translate(4px, -4px);
      color: rgb(var(--glow));
    }

    .card-title {
      margin-top: 35px;
      font-family: "Space Grotesk", sans-serif;
      font-size: 25px;
      font-weight: 500;
      letter-spacing: -1px;
    }

    .card-description {
      color: #9695b2;
      font-size: 12px;
      margin-top: 8px;
      line-height: 1.6;
    }

    /* Bottom details */
    footer {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      margin-top: 42px;
      color: #686780;
      font-size: 10px;
      letter-spacing: 2px;
      text-transform: uppercase;
      animation: fadeUp 1s .9s both;
    }

    .footer-line {
      width: 25px;
      height: 1px;
      background: linear-gradient(90deg, transparent, #77718e);
    }

    .footer-line:last-child {
      transform: rotate(180deg);
    }

    /* Cursor light */
    .cursor-light {
      position: fixed;
      top: 0;
      left: 0;
      width: 350px;
      height: 350px;
      border-radius: 50%;
      pointer-events: none;
      z-index: -1;
      background: radial-gradient(
        circle,
        #a78bfa0b 0%,
        #6ee7f906 35%,
        transparent 70%
      );
      transform: translate(-50%, -50%);
      will-change: left, top;
    }

    /* Responsive */
    @media (max-width: 560px) {
      main {
        width: min(100% - 32px, 400px);
        padding: 30px 0;
      }

      .top-label {
        margin-bottom: 28px;
        font-size: 9px;
      }

      h1 {
        font-size: clamp(62px, 17vw, 90px);
      }

      .description {
        font-size: 13px;
        max-width: 310px;
      }

      .links {
        grid-template-columns: 1fr;
        gap: 12px;
        margin-top: 36px;
      }

      .link-card {
        min-height: 155px;
        padding: 20px;
      }

      .card-top {
        margin-bottom: 0;
      }

      .card-title {
        margin-top: 20px;
        font-size: 22px;
      }

      .card-description {
        margin-top: 5px;
      }

      footer {
        margin-top: 28px;
        font-size: 9px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>

<body>
  <div class="background">
    <div class="aurora one"></div>
    <div class="aurora two"></div>
    <div class="aurora three"></div>
  </div>

  <div class="grid"></div>
  <canvas id="particles"></canvas>
  <div class="cursor-light" id="cursorLight"></div>
  <div class="noise"></div>

  <main>
    <div class="top-label">
      <span class="status-dot"></span>
      YOUR SPACE. YOUR WORLD.
    </div>

    <h1><span>Go beyond.</span></h1>

    <p class="description">
      Two destinations. One beautiful experience.
      Choose your path and discover what comes next.
    </p>

    <nav class="links" aria-label="Étterem">
      <!-- CHANGE THESE TWO LINKS -->
      <a href="/Szakmai/index.html" class="link-card">
        <div class="card-top">
          <div class="icon-box">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="9"></circle>
              <path d="M3 12h18"></path>
              <path d="M12 3a15 15 0 0 1 0 18"></path>
              <path d="M12 3a15 15 0 0 0 0 18"></path>
            </svg>
          </div>
          <span class="arrow">↗</span>
        </div>
        <h2 class="card-title">Étterem</h2>
        <p class="card-description">Étterem weboldalunk.</p>
      </a>

      <a href="/Karpathos/index.html" class="link-card">
        <div class="card-top">
          <div class="icon-box">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 3l2.7 5.5L21 9.4l-4.5 4.4 1.1 6.2-5.6-3-5.6 3 1.1-6.2L3 9.4l6.3-.9L12 3z"></path>
            </svg>
          </div>
          <span class="arrow">↗</span>
        </div>
        <h2 class="card-title">Karpathos</h2>
        <p class="card-description">Egy jobb kréta.</p>
      </a>
    </nav>

    <footer>
      <span class="footer-line"></span>
      <span>LESS NOISE. MORE WONDER.</span>
      <span class="footer-line"></span>
    </footer>
  </main>

  <script>
    // Animated floating particles
    const canvas = document.getElementById("particles");
    const ctx = canvas.getContext("2d");
    const reduceMotion = window.matchMedia(
      "(prefers-reduced-motion: reduce)"
    ).matches;

    let width, height, particles = [];
    const mouse = { x: -1000, y: -1000 };

    function resize() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      width = window.innerWidth;
      height = window.innerHeight;

      canvas.width = width * dpr;
      canvas.height = height * dpr;
      canvas.style.width = width + "px";
      canvas.style.height = height + "px";
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      const count = Math.min(100, Math.floor(width * height / 11000));

      particles = Array.from({ length: count }, () => ({
        x: Math.random() * width,
        y: Math.random() * height,
        radius: Math.random() * 1.5 + 0.3,
        speed: Math.random() * 0.35 + 0.08,
        drift: (Math.random() - 0.5) * 0.3,
        alpha: Math.random() * 0.5 + 0.15
      }));
    }

    function animateParticles() {
      ctx.clearRect(0, 0, width, height);

      particles.forEach(p => {
        if (!reduceMotion) {
          p.y -= p.speed;
          p.x += p.drift;

          const dx = mouse.x - p.x;
          const dy = mouse.y - p.y;
          const distance = Math.hypot(dx, dy);

          if (distance < 100 && distance > 0) {
            p.x -= dx / distance * 0.45;
            p.y -= dy / distance * 0.45;
          }
        }

        if (p.y < -5) {
          p.y = height + 5;
          p.x = Math.random() * width;
        }

        if (p.x < -5) p.x = width + 5;
        if (p.x > width + 5) p.x = -5;

        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(190, 190, 255, ${p.alpha})`;
        ctx.fill();
      });

      if (!reduceMotion) requestAnimationFrame(animateParticles);
    }

    resize();
    animateParticles();

    window.addEventListener("resize", () => {
      resize();
      if (reduceMotion) animateParticles();
    });

    // Soft cursor glow
    const cursorLight = document.getElementById("cursorLight");

    window.addEventListener("pointermove", event => {
      mouse.x = event.clientX;
      mouse.y = event.clientY;

      cursorLight.style.left = event.clientX + "px";
      cursorLight.style.top = event.clientY + "px";
    });

    // Elegant 3D card tilt
    const cards = document.querySelectorAll(".link-card");

    cards.forEach(card => {
      card.addEventListener("pointermove", event => {
        if (event.pointerType !== "mouse" || reduceMotion) return;

        const rect = card.getBoundingClientRect();
        const x = (event.clientX - rect.left) / rect.width;
        const y = (event.clientY - rect.top) / rect.height;

        const rotateY = (x - 0.5) * 8;
        const rotateX = (0.5 - y) * 8;

        card.style.transform =
          `perspective(800px) translateY(-8px) ` +
          `rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
      });

      card.addEventListener("pointerleave", () => {
        card.style.transform = "";
      });
    });
  </script>
</body>
</html>
